[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iradio-cli"
version = "0.1.0"
description = "A keyboard-driven terminal radio player"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
iradio = "iradio.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
