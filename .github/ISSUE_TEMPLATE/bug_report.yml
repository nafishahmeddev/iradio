name: Bug report
description: Report a reproducible problem in iRadio.
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the station, what you clicked or pressed, and the page address. Remove private URLs.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser and version, operating system, phone or desktop, and whether iRadio is installed as an app.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Output or screenshot
      description: A screenshot, and any errors from the browser console. Remove private data.
